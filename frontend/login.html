<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logowanie – TaskBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-5" style="max-width: 28rem">
    <h1 class="text-center mb-1">TaskBoard</h1>
    <p class="text-center text-dark mb-4">Zadania zespołu w jednym miejscu</p>
 
    <div id="message" role="alert"></div>
 
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <ul class="nav nav-tabs card-header-tabs">
          <li class="nav-item">
            <button class="nav-link active" type="button"
                    id="loginTab">Logowanie</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" type="button"
                    id="registerTab">Rejestracja</button>
          </li>
        </ul>
      </div>
 
      <div class="card-body">
        <!-- Formularz logowania -->
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="login" class="form-label">Login</label>
            <input type="text" class="form-control" id="login" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Hasło</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            Zaloguj się
          </button>
        </form>
 
<!-- Formularz rejestracji -->
<form id="registerForm" class="d-none" novalidate>
  <div class="mb-3">
    <label for="registerLogin" class="form-label">Login</label>
    <input type="text" class="form-control"
           id="registerLogin" minlength="3" maxlength="30" required>
    <div class="invalid-feedback">
      Login musi mieć od 3 do 30 znaków.
    </div>
  </div>
 
  <div class="row g-2 mb-3">
    <div class="col-6">
      <label for="firstName" class="form-label">Imię</label>
      <input type="text" class="form-control" id="firstName" required>
      <div class="invalid-feedback">
        Podaj imię.
      </div>
    </div>
 
    <div class="col-6">
      <label for="lastName" class="form-label">Nazwisko</label>
      <input type="text" class="form-control" id="lastName" required>
      <div class="invalid-feedback">
        Podaj nazwisko.
      </div>
    </div>
  </div>
 
  <div class="mb-3">
    <label for="registerPassword" class="form-label">Hasło</label>
    <input type="password" class="form-control"
           id="registerPassword" minlength="8" required>
    <div class="invalid-feedback">
      Hasło musi mieć co najmniej 8 znaków.
    </div>
  </div>
 
  <div class="mb-3">
    <label for="confirmPassword" class="form-label">
      Powtórz hasło
    </label>
    <input type="password" class="form-control"
           id="confirmPassword" required>
    <div class="invalid-feedback">
      Hasła muszą być takie same.
    </div>
  </div>
 
  <button type="submit" class="btn btn-primary w-100">
    Utwórz konto
  </button>
</form>
 
      </div>
    </div>
  </main>
 
  <script src="js/login.js"></script>
</body>
</html>
