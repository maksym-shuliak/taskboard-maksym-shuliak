<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moje tablice – TaskBoard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Pasek nawigacji -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="boards.html">TaskBoard</a>
 
      <div class="d-flex align-items-center gap-3">
        <span class="text-white" id="userName"></span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">
          Wyloguj
        </button>
      </div>
    </div>
  </nav>
 
  <main class="container py-4">
    <!-- Nagłówek strony -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">Moje tablice</h1>
      <button class="btn btn-primary" id="newBoardBtn">
        + Dodaj tablicę
      </button>
    </div>
 
    <!-- Komunikaty -->
    <div id="message"></div>
 
    <!-- Lista tablic -->
    <div class="row g-3" id="boardsList"></div>
  </main>
 
  <!-- Okno dodawania i edycji tablicy -->
   <div class="modal fade" id="boardModal" tabindex="-1"
     role="dialog"
     aria-labelledby="boardModalTitle" aria-hidden="true">
    <div class="modal-dialog">
     
<form class="modal-content" id="boardForm" novalidate>
  <div class="modal-header">
    <h2 class="modal-title h5" id="boardModalTitle">
      Nowa tablica
    </h2>
    <button type="button" class="btn-close"
            data-bs-dismiss="modal" aria-label="Zamknij"></button>
  </div>
 
  <div class="modal-body">
    <div class="mb-3">
      <label for="boardName" class="form-label">
        Nazwa tablicy
      </label>
      <input type="text" class="form-control"
             id="boardName" maxlength="80" required>
      <div class="invalid-feedback">
        Nazwa tablicy musi mieć od 1 do 80 znaków.
      </div>
    </div>
 
    <div class="mb-3">
      <label for="boardDescription" class="form-label">
        Opis
      </label>
      <textarea class="form-control" id="boardDescription"
                rows="3"></textarea>
    </div>
  </div>
 
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary"
            data-bs-dismiss="modal">
      Anuluj
    </button>
    <button type="submit" class="btn btn-primary">
      Zapisz
    </button>
  </div>
</form>
 
    </div>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/boards.js"></script>
</body>
</html>
